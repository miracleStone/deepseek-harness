      openai-codex:
        apiKeyEnv: PI_CODEX_SNAPSHOT_TOKEN
        baseURL: https://codex.snapshot.invalid
        transport: sse
        reasoning: high
        serviceTier: default
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: gpt-6.1-sol
            contextWindow: 272000

