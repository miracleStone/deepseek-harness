  disabled: true

- id: tool-pwsh
  disabled: true

- id: skill
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: system-prompt
  config:
    personaPrefix: You are a concise Codex snapshot agent.
    includeRuntimeContext: false

- insert:
